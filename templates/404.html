<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            color: #ff5733;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .search-box {
            display: flex;
            max-width: 400px;
            margin: 0 auto 40px auto;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #ff5733;
        }

        .search-box button {
            padding: 12px 24px;
            background-color: #ff5733;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: #e04826;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            text-decoration: underline;
            color: #004499;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Oops! Page not found</h1>
        <p>We can't seem to find the page you're looking for. The link might be broken, or the URL may have been mistyped.</p>
        
        <!-- Optional Search Bar -->
        {% comment %} <form class="search-box" action="/search" method="GET">
            <input type="text" name="q" placeholder="Search our site..." required>
            <button type="submit">Search</button>
        </form> {% endcomment %}

        <!-- Helpful Navigation Escape Hatches -->
        <div class="nav-links">
            <a href="/">Go to Homepage</a>
            {% comment %} <a href="/blog">Visit our Blog</a>
            <a href="/contact">Contact Support</a> {% endcomment %}
        </div>
    </div>

</body>
</html>
